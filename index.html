<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotlight Staff System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>SPOTLIGHT</h1>
        <p>Staff Attendance System</p>
    </header>

    <main>

        <!-- LOGIN SECTION -->
        <section class="login-card">

            <h2>Staff Login</h2>

            <label for="staffCode">Staff Code</label>

            <input
                type="password"
                id="staffCode"
                placeholder="Enter staff code"
                autocomplete="off"
            >

            <button id="loginButton">
                LOG IN
            </button>

            <p id="message"></p>

        </section>


        <!-- STAFF STATUS -->
        <section class="status-card">

            <div class="section-heading">
                <div>
                    <h2>Staff Status</h2>
                    <p>Current band staff attendance</p>
                </div>

                <span id="currentTime"></span>
            </div>


            <div class="staff-list" id="staffList">
                <!-- JavaScript will create staff members here -->
            </div>

        </section>

    </main>


    <footer>
        Spotlight Staff System
    </footer>


    <script src="script.js"></script>

</body>

</html>
